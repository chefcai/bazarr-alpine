name: Build and Push Bazarr Alpine Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC. Skips automatically if the upstream Bazarr
    # version is already published (see "Check if image already exists").
    - cron: '0 6 * * *'
    # Weekly at 07:00 UTC on Mondays: force a rebuild even if the Bazarr
    # version hasn't changed, so Alpine base/apk security fixes still land
    # instead of waiting on an upstream Bazarr release.
    - cron: '0 7 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get Bazarr version from upstream release
        id: bazarr_version
        run: |
          VERSION=$(curl -fsSL "https://api.github.com/repos/morpheus65535/bazarr/releases/latest" | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Bazarr version: $VERSION"

      - name: Check if image already exists for this version
        id: check
        run: |
          VERSION="${{ steps.bazarr_version.outputs.version }}"
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull" | jq -r .token)
          HTTP=$(curl -sSL -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/$VERSION")
          if [ "${{ github.event.schedule }}" = "0 7 * * 1" ]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "::notice::Weekly base-image refresh — building $VERSION regardless of publish state."
          elif [ "$HTTP" = "200" ]; then
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION already published — skipping build."
          else
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION not yet published (HTTP $HTTP) — will build."
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only the default branch publishes :latest and :<version>.
          # Any other branch (workflow_dispatch --ref <branch>) publishes
          # :branch-<name> so test builds can never overwrite production tags.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.bazarr_version.outputs.version }},enable={{is_default_branch}}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref_name != 'main' }}

      - name: Set up Docker Buildx
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v4

      # Build and load locally first (never push yet) so the smoke test can
      # run against the exact image before anything reaches GHCR.
      - name: Build Docker image (local, for smoke test)
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            BAZARR_VERSION=${{ steps.bazarr_version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke-test the built image before it's allowed to reach GHCR.
      # Covers: web server responds, ffmpeg/ffprobe are on PATH and runnable,
      # and the two ffmpeg components that silently failed to compile in
      # under HOMELAB-122 (s16le muxer, movtext decoder) are actually present.
      - name: Smoke test image
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        run: |
          set -e
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Smoke-testing $IMAGE"

          echo "-- ffprobe/ffmpeg present and runnable --"
          docker run --rm --entrypoint /usr/local/bin/ffprobe "$IMAGE" -version | head -1
          docker run --rm --entrypoint /usr/local/bin/ffmpeg "$IMAGE" -version | head -1

          echo "-- required ffmpeg components present --"
          docker run --rm --entrypoint /usr/local/bin/ffmpeg "$IMAGE" -muxers 2>/dev/null | grep -qE '\bs16le\b' \
            || { echo "::error::s16le muxer missing from ffmpeg build (see HOMELAB-122)"; exit 1; }
          docker run --rm --entrypoint /usr/local/bin/ffmpeg "$IMAGE" -decoders 2>/dev/null | grep -qE '\bmov_text\b' \
            || { echo "::error::mov_text decoder missing from ffmpeg build (see HOMELAB-122)"; exit 1; }

          echo "-- container starts and answers ping --"
          mkdir -p /tmp/bazarr-smoke-config
          CID=$(docker run -d -p 16767:6767 -v /tmp/bazarr-smoke-config:/config "$IMAGE")
          trap 'docker logs "$CID" || true; docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:16767/api/system/ping || true)
            if [ "$CODE" != "000" ]; then
              echo "Bazarr responded with HTTP $CODE after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Bazarr never answered on :6767 within 30s"
          exit 1

      # Only now push the image that just passed the smoke test.
      - name: Push Docker image
        if: (github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true') && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BAZARR_VERSION=${{ steps.bazarr_version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
